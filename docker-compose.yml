services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      WORKSPACE_DIR: /app/workspace
      DATA_DIR: /app/data
      HEARTBEAT: /app/data/heartbeat
    volumes:
      - ./data/workspace:/app/workspace # agent's playground + inbox (host-visible)
      - ./data/bot:/app/data # sqlite db + heartbeat
    mem_limit: 2g # hard cap for bot + all sandboxed scripts
    cpus: 1.0 # set to your VPS core count (or below it)
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
