[project]
name = "tgagent"
version = "0.1.0"
description = "Personal Telegram AI assistant powered by GLM, with a sandboxed workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==22.8",
    "openai>=1.100,<3",
    "pdfplumber>=0.11,<1",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "pillow>=10,<12",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tgagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
